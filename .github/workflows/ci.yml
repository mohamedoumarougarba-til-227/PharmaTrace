name: Public checks
on:
  pull_request:
  push:
    branches: [main, 'hardening/**', 'codex/**']
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    name: app-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/PharmaTrace
    env:
      CI: 'true'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-not-a-credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/PharmaTrace/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run check:public
      - run: npm run build:web
      - run: npm run check:export
      - run: git diff --check
